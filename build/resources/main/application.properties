# ── Application ──────────────────────────────────────────────────────────────
spring.application.name=zeno
server.port=8080

# ── Database (PostgreSQL) ─────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5435/postgres
spring.datasource.username=postgres
spring.datasource.password=zeno
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Flyway (DB migrations) ────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ── Redis Cache (disabled — use simple in-memory cache) ──────────────────────
spring.cache.type=simple

# ── JWT ───────────────────────────────────────────────────────────────────────
zeno.jwt.secret=zenoSuperSecretKey256BitsLongForHS256AlgorithmUseInDev
zeno.jwt.expiration=86400000

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.zeno=DEBUG
logging.level.org.springframework.security=DEBUG

# ── Swagger UI ────────────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
